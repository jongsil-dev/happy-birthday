<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🎂 쟈기 생일축하해!</title>
  <meta property="og:title" content="💌 특별한 생일 선물이 도착했어요!" />
  <meta property="og:description" content="링크를 눌러서 확인해보세요 🎂💝" />
  <meta name="theme-color" content="#ff6b8b" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-top: #fff6f8;
      --bg-mid: #ffe8ef;
      --bg-bot: #ffdce7;
      --rose: #ff477e;
      --rose-dark: #e63268;
      --rose-soft: #ff85a1;
      --gold: #f59e0b;
      --ink: #3b1d2a;
      --muted: #7a4b5c;
      --card: rgba(255, 255, 255, 0.92);
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 배경 떠다니는 반짝이/하트 */
    .bg-floaters {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .floater {
      position: absolute;
      bottom: -40px;
      opacity: 0;
      animation: floatUp linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 0.45;
      }
      85% {
        opacity: 0.35;
      }
      100% {
        transform: translateY(-110dvh) scale(1.15) rotate(20deg);
        opacity: 0;
      }
    }

    /* 컨페티 캔버스 */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    /* 음악 토글 버튼 */
    .sound-btn {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      z-index: 30;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 71, 126, 0.25);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 20px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 71, 126, 0.16);
      transition: transform 0.15s ease;
    }

    .sound-btn.visible {
      display: flex;
    }

    .sound-btn:active {
      transform: scale(0.92);
    }

    /* 메인 컨테이너 */
    .stage {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 34px 24px 30px;
      text-align: center;
      box-shadow:
        0 20px 50px rgba(230, 50, 104, 0.14),
        0 4px 14px rgba(255, 133, 161, 0.15),
        inset 0 0 0 1.5px rgba(255, 255, 255, 0.85);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: #fff0f4;
      color: var(--rose);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 71, 126, 0.18);
    }

    /* 선물 상자 (초기 화면) */
    .gift-wrap {
      width: 132px;
      height: 132px;
      margin: 4px auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: giftBounce 2.2s ease-in-out infinite;
      cursor: pointer;
    }

    @keyframes giftBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-7px) rotate(-2deg); }
      50% { transform: translateY(0) rotate(0deg); }
      75% { transform: translateY(-4px) rotate(2deg); }
    }

    .intro-title {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.38;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      color: var(--ink);
    }

    .intro-sub {
      font-size: 15px;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 28px;
    }

    /* 메인 축하 버튼 */
    .open-btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding: 17px 22px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #ff5c8d 0%, #ff336d 100%);
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(255, 51, 109, 0.34);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .open-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -80%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.38), transparent);
      transform: skewX(-22deg);
      animation: sheen 2.8s infinite;
    }

    @keyframes sheen {
      0%, 60% { left: -80%; }
      100% { left: 140%; }
    }

    .open-btn:active {
      transform: scale(0.97);
      box-shadow: 0 6px 16px rgba(255, 51, 109, 0.28);
    }

    /* 축하 공개 화면 */
    .hidden {
      display: none !important;
    }

    .reveal-anim {
      animation: popIn 0.55s cubic-bezier(0.18, 1.25, 0.32, 1) forwards;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.86) translateY(16px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* 케이크 SVG */
    .cake-wrap {
      width: 156px;
      height: 146px;
      margin: 0 auto 14px;
      cursor: pointer;
      position: relative;
    }

    .flame {
      transform-origin: center bottom;
      animation: flicker 0.9s ease-in-out infinite alternate;
    }

    .flame.delay1 { animation-delay: 0.2s; }
    .flame.delay2 { animation-delay: 0.45s; }

    .flame.out {
      opacity: 0;
      transform: scale(0);
      transition: all 0.25s ease;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); opacity: 0.95; }
      100% { transform: scale(1.08, 1.15) rotate(2deg); opacity: 1; }
    }

    .cake-hint {
      font-size: 11.5px;
      color: #a17182;
      margin-bottom: 18px;
    }

    .main-msg-box {
      background: linear-gradient(145deg, #fff5f8 0%, #ffeaf1 100%);
      border: 1.5px solid rgba(255, 71, 126, 0.22);
      border-radius: 20px;
      padding: 22px 18px;
      margin-bottom: 20px;
    }

    .main-msg {
      font-size: 27px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: -0.02em;
      color: var(--rose-dark);
      margin-bottom: 12px;
      word-break: keep-all;
    }

    .sub-msg {
      font-size: 15.5px;
      line-height: 1.65;
      color: #5c3242;
      font-weight: 500;
      word-break: keep-all;
    }

    .replay-btn {
      width: 100%;
      padding: 14px 18px;
      border-radius: 15px;
      border: 1.5px solid rgba(255, 71, 126, 0.28);
      background: #ffffff;
      color: var(--rose-dark);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .replay-btn:active {
      transform: scale(0.97);
      background: #fff5f8;
    }
  </style>
</head>
<body>
  <div class="bg-floaters" id="bgFloaters" aria-hidden="true"></div>
  <canvas id="confettiCanvas" aria-hidden="true"></canvas>

  <button class="sound-btn" id="soundBtn" type="button" aria-label="음악 켜기/끄기">🔊</button>

  <main class="stage">
    <!-- 1. 버튼 누르기 전 화면 -->
    <section class="card" id="introCard">
      <span class="badge">SPECIAL DELIVERY 💌</span>

      <div class="gift-wrap" id="giftTap" role="button" tabindex="0" aria-label="선물 상자 열기">
        <svg viewBox="0 0 120 120" width="124" height="124" fill="none">
          <!-- 그림자 -->
          <ellipse cx="60" cy="106" rx="38" ry="7" fill="#f9c6d7" opacity="0.6" />
          <!-- 상자 몸통 -->
          <rect x="24" y="52" width="72" height="50" rx="10" fill="#ff5c8d" />
          <rect x="24" y="52" width="72" height="12" fill="#e63268" opacity="0.22" />
          <!-- 세로 리본 -->
          <rect x="53" y="52" width="14" height="50" fill="#ffd166" />
          <!-- 뚜껑 -->
          <rect x="19" y="38" width="82" height="18" rx="7" fill="#ff759f" />
          <rect x="53" y="38" width="14" height="18" fill="#ffe08a" />
          <!-- 리본 매듭 -->
          <path d="M60 38C50 22 33 22 35 33C36 40 50 40 60 38Z" fill="#ffd166" stroke="#f59e0b" stroke-width="1.5" />
          <path d="M60 38C70 22 87 22 85 33C84 40 70 40 60 38Z" fill="#ffd166" stroke="#f59e0b" stroke-width="1.5" />
          <circle cx="60" cy="37" r="6" fill="#f59e0b" />
          <!-- 반짝이 -->
          <path d="M20 24L22 19L24 24L29 26L24 28L22 33L20 28L15 26Z" fill="#f59e0b" />
          <path d="M98 18L99.5 14L101 18L105 19.5L101 21L99.5 25L98 21L94 19.5Z" fill="#ff477e" />
        </svg>
      </div>

      <h1 class="intro-title">오늘의 주인공에게<br />생일 축하가 도착했어요</h1>
      <p class="intro-sub">아래 버튼을 눌러서<br />도착한 메시지와 축하를 받아보세요</p>

      <button class="open-btn" id="openBtn" type="button">
        🎂 생일 축하 받기
      </button>
    </section>

    <!-- 2. 버튼 누른 후 축하 화면 -->
    <section class="card hidden" id="celebrateCard">
      <span class="badge">HAPPY BIRTHDAY 🎉</span>

      <div class="cake-wrap" id="cakeWrap" role="button" tabindex="0" aria-label="케이크 촛불 끄기 또는 켜기">
        <svg viewBox="0 0 160 150" width="156" height="146" fill="none">
          <!-- 접시 -->
          <ellipse cx="80" cy="134" rx="64" ry="10" fill="#f8c8d8" />
          <ellipse cx="80" cy="131" rx="60" ry="8" fill="#ffffff" />

          <!-- 아래층 시트 -->
          <rect x="28" y="92" width="104" height="38" rx="12" fill="#ff85a1" />
          <path d="M28 102C38 109 48 109 58 102C68 95 78 95 88 102C98 109 108 109 118 102C124 98 128 99 132 102V92H28V102Z" fill="#fff8fa" />

          <!-- 위층 시트 -->
          <rect x="44" y="60" width="72" height="34" rx="10" fill="#ffb3c6" />
          <path d="M44 68C52 75 60 75 68 68C76 61 84 61 92 68C100 75 108 75 116 68V60H44V68Z" fill="#ffffff" />

          <!-- 데코 스프링클 -->
          <circle cx="58" cy="79" r="2.5" fill="#ffd166" />
          <circle cx="80" cy="83" r="2.5" fill="#ff477e" />
          <circle cx="102" cy="78" r="2.5" fill="#6ee7b7" />
          <circle cx="48" cy="116" r="3" fill="#ffd166" />
          <circle cx="80" cy="118" r="3" fill="#ffffff" />
          <circle cx="112" cy="115" r="3" fill="#ffd166" />

          <!-- 촛불 3개 -->
          <rect x="57" y="36" width="6" height="24" rx="3" fill="#ffd166" />
          <rect x="77" y="32" width="6" height="28" rx="3" fill="#ff5c8d" />
          <rect x="97" y="36" width="6" height="24" rx="3" fill="#7dd3fc" />

          <!-- 심지 -->
          <line x1="60" y1="36" x2="60" y2="31" stroke="#4a2c38" stroke-width="1.8" />
          <line x1="80" y1="32" x2="80" y2="27" stroke="#4a2c38" stroke-width="1.8" />
          <line x1="100" y1="36" x2="100" y2="31" stroke="#4a2c38" stroke-width="1.8" />

          <!-- 불꽃 -->
          <g class="flame" id="flame1">
            <path d="M60 15C65 22 65 29 60 31C55 29 55 22 60 15Z" fill="#fb923c" />
            <path d="M60 20C62.5 24 62.5 28 60 29.5C57.5 28 57.5 24 60 20Z" fill="#fef08a" />
          </g>
          <g class="flame delay1" id="flame2">
            <path d="M80 10C85.5 18 85.5 25 80 27C74.5 25 74.5 18 80 10Z" fill="#fb923c" />
            <path d="M80 16C82.5 20 82.5 24 80 25.5C77.5 24 77.5 20 80 16Z" fill="#fef08a" />
          </g>
          <g class="flame delay2" id="flame3">
            <path d="M100 15C105 22 105 29 100 31C95 29 95 22 100 15Z" fill="#fb923c" />
            <path d="M100 20C102.5 24 102.5 28 100 29.5C97.5 28 97.5 24 100 20Z" fill="#fef08a" />
          </g>
        </svg>
      </div>
      <p class="cake-hint" id="cakeHint">케이크를 터치하면 촛불을 껐다 켤 수 있어요 ✨</p>

      <div class="main-msg-box">
        <h1 class="main-msg">🎂 쟈기 생일축하해 💝</h1>
        <p class="sub-msg">
          나와 같이 즐거운 휴가 보내자 ✨
        </p>
      </div>

      <button class="replay-btn" id="replayBtn" type="button">
        🎉 한 번 더 축하 터뜨리기
      </button>
    </section>
  </main>

  <script>
    // 1. 배경 떠다니는 하트/반짝이
    (function initFloaters() {
      const container = document.getElementById("bgFloaters");
      const icons = ["💖", "✨", "🎂", "💝", "🌸", "🎈"];
      for (let i = 0; i < 16; i++) {
        const el = document.createElement("span");
        el.className = "floater";
        el.textContent = icons[i % icons.length];
        el.style.left = Math.random() * 100 + "%";
        el.style.fontSize = (14 + Math.random() * 14) + "px";
        el.style.animationDuration = (7 + Math.random() * 7) + "s";
        el.style.animationDelay = (-Math.random() * 10) + "s";
        container.appendChild(el);
      }
    })();

    // 2. 컨페티(꽃가루) 파티클 엔진
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let animId = null;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const CONFETTI_COLORS = [
      "#ff477e", "#ff85a1", "#ffd166", "#6ee7b7",
      "#7dd3fc", "#c084fc", "#fb7185", "#fbbf24"
    ];

    function launchConfetti(count = 130) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      for (let i = 0; i < count; i++) {
        const fromLeft = i % 2 === 0;
        const startX = w * (0.2 + Math.random() * 0.6);
        const startY = h * 0.48;
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.55;
        const speed = 5 + Math.random() * 11;
        particles.push({
          x: startX,
          y: startY,
          vx: Math.cos(angle) * speed + (fromLeft ? -1 : 1) * Math.random() * 1.5,
          vy: Math.sin(angle) * speed - 2,
          size: 6 + Math.random() * 7,
          color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.24,
          shape: Math.random() < 0.25 ? "circle" : "rect",
          alpha: 1
        });
      }
      if (!animId) tickConfetti();
    }

    function tickConfetti() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      particles = particles.filter((p) => p.alpha > 0.02 && p.y < window.innerHeight + 30);

      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.24; // 중력
        p.vx *= 0.985;
        p.rot += p.vRot;
        if (p.y > window.innerHeight * 0.72) p.alpha -= 0.018;

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.shape === "circle") {
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.45, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-p.size / 2, -p.size * 0.3, p.size, p.size * 0.6);
        }
        ctx.restore();
      }

      if (particles.length > 0) {
        animId = requestAnimationFrame(tickConfetti);
      } else {
        animId = null;
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }
    }

    // 3. Web Audio API 생일 축하 노래 (오르골 톤)
    let audioCtx = null;
    let isMuted = false;
    let songTimers = [];

    const NOTES = {
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23,
      G4: 392.00, A4: 440.00, Bb4: 466.16, C5: 523.25
    };

    // (음, 박자)
    const HAPPY_BIRTHDAY = [
      ["C4", 0.32], ["C4", 0.18], ["D4", 0.50], ["C4", 0.50], ["F4", 0.50], ["E4", 0.95],
      ["C4", 0.32], ["C4", 0.18], ["D4", 0.50], ["C4", 0.50], ["G4", 0.50], ["F4", 0.95],
      ["C4", 0.32], ["C4", 0.18], ["C5", 0.50], ["A4", 0.50], ["F4", 0.50], ["E4", 0.50], ["D4", 0.85],
      ["Bb4", 0.32], ["Bb4", 0.18], ["A4", 0.50], ["F4", 0.50], ["G4", 0.50], ["F4", 1.10]
    ];

    function stopSong() {
      songTimers.forEach((t) => clearTimeout(t));
      songTimers = [];
    }

    function playTone(freq, duration) {
      if (!audioCtx || isMuted) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.22, now + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.95);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    function playHappyBirthday() {
      stopSong();
      if (isMuted) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) audioCtx = new AudioContextClass();
        if (audioCtx.state === "suspended") audioCtx.resume();

        let elapsed = 80;
        HAPPY_BIRTHDAY.forEach(([note, dur]) => {
          const t = setTimeout(() => playTone(NOTES[note], dur), elapsed);
          songTimers.push(t);
          elapsed += dur * 1000 * 0.88;
        });
      } catch (e) {
        // 오디오 미지원 환경은 조용히 무시
      }
    }

    // 4. 화면 전환 및 인터랙션
    const introCard = document.getElementById("introCard");
    const celebrateCard = document.getElementById("celebrateCard");
    const openBtn = document.getElementById("openBtn");
    const giftTap = document.getElementById("giftTap");
    const replayBtn = document.getElementById("replayBtn");
    const soundBtn = document.getElementById("soundBtn");
    const cakeWrap = document.getElementById("cakeWrap");
    const cakeHint = document.getElementById("cakeHint");
    const flames = [
      document.getElementById("flame1"),
      document.getElementById("flame2"),
      document.getElementById("flame3")
    ];
    let candlesLit = true;

    function openCelebration() {
      introCard.classList.add("hidden");
      celebrateCard.classList.remove("hidden");
      celebrateCard.classList.add("reveal-anim");
      soundBtn.classList.add("visible");
      launchConfetti(140);
      playHappyBirthday();
    }

    openBtn.addEventListener("click", openCelebration);
    giftTap.addEventListener("click", openCelebration);
    giftTap.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") openCelebration();
    });

    replayBtn.addEventListener("click", () => {
      launchConfetti(120);
      playHappyBirthday();
    });

    soundBtn.addEventListener("click", () => {
      isMuted = !isMuted;
      soundBtn.textContent = isMuted ? "🔇" : "🔊";
      if (isMuted) {
        stopSong();
      } else {
        playHappyBirthday();
      }
    });

    function toggleCandles() {
      candlesLit = !candlesLit;
      flames.forEach((f) => f.classList.toggle("out", !candlesLit));
      cakeHint.textContent = candlesLit
        ? "케이크를 터치하면 촛불을 껐다 켤 수 있어요 ✨"
        : "후~ 소원을 빌었어요! 다시 터치하면 켜져요 🕯️";
      if (!candlesLit) launchConfetti(60);
    }

    cakeWrap.addEventListener("click", toggleCandles);
    cakeWrap.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") toggleCandles();
    });
  </script>
</body>
</html>
